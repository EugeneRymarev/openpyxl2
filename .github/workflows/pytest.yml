name: Python package

on:
  push:
    branches: ["master", "codex/python314-support"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }} / ${{ matrix.xml-backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        xml-backend: [lxml]
        include:
          - python-version: "3.14"
            os: ubuntu-latest
            xml-backend: stdlib
          - python-version: "3.14"
            os: windows-latest
            xml-backend: lxml
          - python-version: "3.14"
            os: windows-latest
            xml-backend: stdlib
    env:
      OPENPYXL_LXML: ${{ matrix.xml-backend == 'lxml' && 'True' || 'False' }}
      OPENPYXL_DEFUSEDXML: "False"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 -r requirements.txt
          python -m pip install -e .
          python -m pip check
          python -m pip list
      - name: Check selected XML backend
        run: python -c "import os, openpyxl; assert openpyxl.LXML == (os.environ['OPENPYXL_LXML'] == 'True'); assert not openpyxl.DEFUSEDXML; print('lxml enabled:', openpyxl.LXML)"
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: python -m pytest

  wheel:
    name: Python 3.14 / installed wheel without lxml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -m pip check
      - name: Check installed wheel without optional dependencies
        run: .wheel-venv/bin/python -I .github/scripts/check_wheel.py
